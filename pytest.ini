[pytest]
testpaths = tests
python_files = test_*.py
markers =
    offline: behavioural scenarios that need no network or credentials (default)
    recorded: behavioural scenarios driven by JSON captured from the real HSP API
    live: end-to-end scenarios that hit the real Darwin HSP API; require HSP_CREDENTIALS_FILE
    gmail: live Gmail API scenarios (claim-status inbox); require ## Gmail API ## + token
    vision: Ollama golden ticket quality gate (all accept+reject fixtures); require Ollama + trainline-ticket
addopts = -m "not live and not vision and not gmail"
# Enable vision gate:  pytest --vision-gate   OR   TRAINLINE_VISION_GATE=1 pytest
